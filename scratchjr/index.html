<!DOCTYPE html>
<html>
<head>
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-X3HG3NKWG8"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-X3HG3NKWG8');
  </script>
  <meta name="description" content="With ScratchJr for web, young children (ages 5-7) can program their own interactive stories and games. In the process, they learn to solve problems, design projects,">
  <title>ScratchJr for web - Programming for Young Children (Ages 5-7)</title>
  <link rel="icon" type="image/x-icon" href="https://codejr.org/scratchjr/assets/ui/favicon.ico">

  <!-- עיצוב החלון הקופץ -->
  <style>
    /* רקע כהה ומטושטש מאחורי החלון */
    .popup-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0, 0, 0, 0.6);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 9999;
      font-family: Arial, sans-serif;
    }

    /* תיבת ההודעה */
    .popup-box {
      background-color: #ffffff;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.25);
      text-align: center;
      max-width: 420px;
      width: 90%;
      position: relative;
    }

    .popup-box h2 {
      margin-top: 0;
      color: #333333;
      font-size: 24px;
    }

    .popup-box p {
      color: #555555;
      font-size: 16px;
      line-height: 1.5;
      margin: 15px 0 25px 0;
    }

    /* כפתור מעבר לגרסה החדשה */
    .popup-btn {
      display: inline-block;
      background-color: #4CAF50;
      color: white;
      padding: 12px 24px;
      text-decoration: none;
      font-weight: bold;
      border-radius: 6px;
      font-size: 16px;
      transition: background-color 0.2s ease;
    }

    .popup-btn:hover {
      background-color: #45a049;
    }

    /* כפתור סגירה (איקס) */
    .close-btn {
      position: absolute;
      top: 10px;
      right: 15px;
      font-size: 24px;
      font-weight: bold;
      color: #aaa;
      cursor: pointer;
    }

    .close-btn:hover {
      color: #333;
    }
  </style>
</head>
<body style="background-color:#F3F2EC;">

  <!-- רכיב החלון הקופץ -->
  <div id="noticePopup" class="popup-overlay">
    <div class="popup-box">
      <span class="close-btn" onclick="closePopup()">&times;</span>
      <h2>New Version Available!</h2>
      <p>We have launched a new version that will replace the current version in early August.</p>
      <a href="https://moshe1ch-kidi.github.io/codejrkids/" class="popup-btn" target="_blank">Click here for the new version</a>
    </div>
  </div>

  <div style="justify-content: center; display: flex;">
    <iframe scrolling="no" frameborder="no" clocktype="html5" 
      style="overflow:hidden;border:0;margin:0;padding:0;width:100%;height:848px;" allow="autoplay; camera; microphone; xr-spatial-tracking" 
      sandbox="allow-downloads allow-forms allow-pointer-lock allow-popups 
              allow-same-origin allow-scripts allow-popups-to-escape-sandbox" 
      src="https://moshech1.github.io/jrweb.github.io/index1.html"></iframe>
  </div>

  <!-- סקריפט לסגירת החלון -->
  <script>
    function closePopup() {
      document.getElementById('noticePopup').style.display = 'none';
    }
  </script>
</body>
</html>
